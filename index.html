<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextLevel | Job Quest 🚀</title>
    <!-- FIXED: Correct Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: radial-gradient(circle at top right, #1e1b4b, #000000); min-height: 100vh; color: white; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="p-4 md:p-10 font-sans">
    <div class="max-w-5xl mx-auto">
        <header class="flex justify-between items-center mb-12">
            <div>
                <h1 class="text-3xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-purple-500">
                     Career Odyssey ⚡
                </h1>
                <p class="text-gray-400">Target: Senior Frontend Developer 🎯</p>
            </div>
            <div class="glass px-4 py-2 rounded-full text-sm font-medium animate-pulse text-cyan-400">
                Live Tracking 📡
            </div>
        </header>

        <!-- Main Tracking Table -->
        <div class="glass rounded-3xl overflow-hidden">
            <div class="p-6 border-b border-white/10 flex justify-between items-center">
                <h2 class="text-xl font-semibold">Active Applications 📂</h2>
            </div>
            <table class="w-full text-left">
                <thead class="text-gray-400 text-xs uppercase bg-white/5">
                    <tr>
                        <th class="px-6 py-4">Company</th>
                        <th class="px-6 py-4">Role</th>
                        <th class="px-6 py-4">Status</th>
                    </tr>
                </thead>
                <!-- FIXED: Added an ID here so we can inject data -->
                <tbody id="job-table-body" class="divide-y divide-white/5 text-sm">
                    <tr>
                        <td colspan="3" class="px-6 py-8 text-center text-gray-500 animate-pulse">Loading from Supabase...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

<!-- FIXED: Correct Supabase Library Link -->
    <script src="https://unpkg.com"></script>


<script>
  const SUPABASE_URL = 'https://rhutockhmksbnododbmm.supabase.co'
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJodXRvY2tobWtzYm5vZG9kYm1tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczMTYyNDcsImV4cCI6MjA5Mjg5MjI0N30.qKRj4YrwKs0keY2NLOJ3ZGuvRtERdb5shXbBFQka3G4'
  
  // FIXED: Accessing the library correctly
  const { createClient } = supabase
  const client = createClient(SUPABASE_URL, SUPABASE_KEY)

  async function loadJobs() {
    console.log("Fetching jobs...")
    const { data: jobs, error } = await client.from('jobs').select('*')
    
    if (error) {
        console.error("Error:", error)
        return
    }

    const tableBody = document.getElementById('job-table-body')
    tableBody.innerHTML = '' // Clear the loading message

    if (jobs.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="3" class="px-6 py-8 text-center text-gray-500">No jobs found. Add one in Supabase!</td></tr>'
        return
    }

    jobs.forEach(job => {
      const row = `
        <tr class="hover:bg-white/5 transition">
            <td class="px-6 py-4 font-medium italic">${job.company || 'Unknown'}</td>
            <td class="px-6 py-4">${job.role || 'N/A'}</td>
            <td class="px-6 py-4">
                <span class="bg-cyan-500/20 text-cyan-400 px-3 py-1 rounded-full border border-cyan-500/50">
                    ${job.status || 'Pending'}
                </span>
            </td>
        </tr>`
      tableBody.innerHTML += row
    })
    console.log("Table updated with real data!")
  }

  loadJobs()
</script>

</body>
</html>
