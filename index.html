<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextLevel | Job Quest 🚀</title>
    <script src="https://tailwindcss.com"></script>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { background: radial-gradient(circle at top right, #1e1b4b, #000000); min-height: 100vh; color: white; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .file-upload-btn { border: 1px dashed rgba(255, 255, 255, 0.2); transition: all 0.3s ease; }
        .file-upload-btn:hover { border-color: #22d3ee; background: rgba(34, 211, 238, 0.05); }
    </style>
</head>
<body class="p-4 md:p-10 font-sans text-white">
    <div class="max-w-5xl mx-auto">
        <header class="flex justify-between items-center mb-12">
            <div>
                <h1 class="text-3xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-purple-500">
                     Career Odyssey ⚡
                </h1>
                <p class="text-gray-400">Target: Senior Frontend Developer 🎯</p>
            </div>
            <div id="status-badge" class="glass px-4 py-2 rounded-full text-sm font-medium text-yellow-400">
                Connecting... 📡
            </div>
        </header>

        <div class="glass p-6 rounded-3xl mb-10 border border-cyan-500/20">
            <h2 class="text-xl font-semibold mb-4 text-cyan-400">Add New Application ✍️</h2>
            <div class="space-y-4">
                <div class="flex flex-col md:flex-row gap-4">
                    <input id="new-company" type="text" placeholder="Company Name" class="bg-white/5 border border-white/10 rounded-xl px-4 py-2 flex-1 focus:border-cyan-500 outline-none transition text-white">
                    <input id="new-role" type="text" placeholder="Role (e.g. React Developer)" class="bg-white/5 border border-white/10 rounded-xl px-4 py-2 flex-1 focus:border-cyan-500 outline-none transition text-white">
                </div>
                
                <div class="flex flex-col md:flex-row items-center gap-4">
                    <div class="flex-1 w-full">
                        <label for="media-upload" class="file-upload-btn flex items-center justify-center gap-2 w-full px-4 py-2 rounded-xl cursor-pointer text-gray-400 text-sm">
                            <span id="file-label">📎 Attach Screenshot or PDF</span>
                            <input type="file" id="media-upload" class="hidden" onchange="updateFileLabel(this)">
                        </label>
                    </div>
                    <button id="save-btn" onclick="addJob()" class="w-full md:w-auto bg-cyan-500 hover:bg-cyan-400 text-black px-8 py-2 rounded-xl font-bold transition transform active:scale-95 flex items-center justify-center gap-2">
                        Save Entry
                    </button>
                </div>
            </div>
        </div>

        <div class="glass rounded-3xl overflow-hidden">
            <div class="p-6 border-b border-white/10">
                <h2 class="text-xl font-semibold">Active Applications 📂</h2>
            </div>
            <table class="w-full text-left">
                <thead class="text-gray-400 text-xs uppercase bg-white/5">
                    <tr>
                        <th class="px-6 py-4">Company</th>
                        <th class="px-6 py-4">Role</th>
                        <th class="px-6 py-4">Attachment</th>
                        <th class="px-6 py-4">Status</th>
                    </tr>
                </thead>
                <tbody id="job-table-body" class="divide-y divide-white/5 text-sm">
                    <tr>
                        <td colspan="4" class="px-6 py-8 text-center text-gray-500 animate-pulse">Loading jobs...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
   <script>
    // 1. CONFIGURATION (MUST BE AT THE VERY TOP)
    const SUPABASE_URL = 'https://supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJodXRvY2tobWtzYm5vZG9kYm1tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczMTYyNDcsImV4cCI6MjA5Mjg5MjI0N30.qKRj4YrwKs0keY2NLOJ3ZGuvRtERdb5shXbBFQka3G4';
    
    // 2. INITIALIZE CLIENT (This must happen before any functions are called)
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 3. HELPER FUNCTIONS
    function setStatus(msg, colorClass) {
        const badge = document.getElementById('status-badge');
        if (badge) {
            badge.innerText = msg;
            badge.className = `glass px-4 py-2 rounded-full text-sm font-medium ${colorClass}`;
        }
    }

    async function uploadMedia(file) {
        const fileExt = file.name.split('.').pop();
        const fileName = `${Math.random()}_${Date.now()}.${fileExt}`;
        
        const { data, error } = await _supabase.storage
            .from('job-media')
            .upload(fileName, file);

        if (error) throw error;

        const { data: { publicUrl } } = _supabase.storage
            .from('job-media')
            .getPublicUrl(fileName);

        return publicUrl;
    }

    // 4. MAIN FUNCTIONS
    async function loadJobs() {
        try {
            const { data: jobs, error } = await _supabase
                .from('jobs')
                .select('*')
                .order('created_at', { ascending: false });
            
            if (error) throw error;

            const tableBody = document.getElementById('job-table-body');
            tableBody.innerHTML = ''; 

            if (!jobs || jobs.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="4" class="px-6 py-8 text-center text-gray-500">No applications found yet.</td></tr>';
            } else {
                jobs.forEach(job => {
                    const attachmentLink = job.attachment_url 
                        ? `<a href="${job.attachment_url}" target="_blank" class="text-cyan-400 underline hover:text-cyan-300">View File 📄</a>`
                        : `<span class="text-gray-600">None</span>`;

                    tableBody.innerHTML += `
                        <tr class="hover:bg-white/5 transition">
                            <td class="px-6 py-4 font-medium italic text-cyan-300">${job.company}</td>
                            <td class="px-6 py-4 text-gray-300">${job.role}</td>
                            <td class="px-6 py-4">${attachmentLink}</td>
                            <td class="px-6 py-4">
                                <span class="bg-cyan-500/10 text-cyan-400 px-3 py-1 rounded-full border border-cyan-500/30 text-xs">
                                    ${job.status || 'Applied'}
                                </span>
                            </td>
                        </tr>`;
                });
            }
            setStatus('Live Tracking 📡', 'text-cyan-400');
        } catch (err) {
            console.error("Fetch error:", err);
            setStatus('Connection Error ❌', 'text-red-400');
        }
    }

    async function addJob() {
        const companyInput = document.getElementById('new-company');
        const roleInput = document.getElementById('new-role');
        const fileInput = document.getElementById('media-upload');
        const saveBtn = document.getElementById('save-btn');
        
        const company = companyInput.value.trim();
        const role = roleInput.value.trim();

        if (!company || !role) return alert("Fill in all fields!");

        setStatus('Processing... ⏳', 'text-yellow-400');
        saveBtn.disabled = true;

        try {
            let fileUrl = null;

            if (fileInput.files.length > 0) {
                fileUrl = await uploadMedia(fileInput.files[0]); // Make sure to use files[0]
            }

            const { error } = await _supabase.from('jobs').insert([
                { 
                    company, 
                    role, 
                    status: 'Applied 📩',
                    attachment_url: fileUrl 
                }
            ]);

            if (error) throw error;

            companyInput.value = '';
            roleInput.value = '';
            fileInput.value = '';
            document.getElementById('file-label').innerText = "📎 Attach Screenshot or PDF";
            document.getElementById('file-label').classList.remove('text-cyan-400');
            
            await loadJobs();
        } catch (err) {
            alert("Error: " + err.message);
            setStatus('Error ❌', 'text-red-400');
        } finally {
            saveBtn.disabled = false;
        }
    }

    // 5. START APP
    loadJobs();
</script>
</body>
</html>
